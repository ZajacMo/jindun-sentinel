[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jindun-pipeline"
version = "0.1.0"
description = "JinDun Sentinel computation pipeline: indices, regimes and spillover networks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "JinDun Sentinel contributors" }]
keywords = ["financial-stability", "systemic-risk", "spillover", "ciss"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pypdf>=5.0",
]

[project.optional-dependencies]
arch = ["arch>=7.0"]
market = ["akshare>=1.16"]
ml = ["torch>=2.4"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
jindun-pipeline = "jindun.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jindun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
