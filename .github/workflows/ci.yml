name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --all-packages --extra dev

      - name: Lint
        run: |
          uv run ruff check packages
          uv run ruff format --check packages

      - name: Test
        run: uv run pytest packages -q

      - name: Check that the locale catalogues agree
        run: uv run python scripts/audit_locale_keys.py

  front-end:
    name: Front end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check and build
        run: |
          npm run typecheck
          npm run build

      - name: Test
        run: npm test
