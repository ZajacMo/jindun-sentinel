[project]
name = "jindun-sentinel"
version = "0.1.0"
description = "JinDun Sentinel - an open-source multi-country systemic financial risk monitoring and early warning system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "JinDun Sentinel contributors" }]
dependencies = [
  "jindun-pipeline",
  "jindun-api",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[tool.uv.workspace]
members = ["packages/pipeline", "packages/api", "packages/agent"]
exclude = ["packages/web"]

[tool.uv.sources]
jindun-pipeline = { workspace = true }
jindun-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
