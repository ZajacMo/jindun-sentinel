# The web front end, served as a static bundle behind a reverse proxy.
#
# The front end calls the API on its own origin, so the API prefix is proxied
# to the `api` service of the compose file and no cross-origin request is made.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API and its interactive documentation.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The single-page application: every unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed, so it may be cached for a long time; the
    # entry point may not, or a new release would not reach an open tab.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
